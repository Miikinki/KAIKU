<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KAIKU</title>
    <!-- KAIKU Signal Logo Favicon -->
    <link rel="icon" type="image/svg+xml" href="/kaiku-icon.svg" />
    <link rel="apple-touch-icon" href="/kaiku-icon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      /* FULL SCREEN RESET */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0a0a12;
        overflow: hidden;
        position: fixed; /* Lock body to prevent bounce/elastic scrolling */
        overscroll-behavior: none; /* Prevent pull-to-refresh effects */
        -webkit-font-smoothing: antialiased;
      }
      #root {
        height: 100%;
        width: 100%;
        position: relative; 
      }
      
      /* --- CRITICAL RENDER FIXES FOR MOBILE MAP ARTIFACTS --- */
      
      /* 1. Force the container to match app theme so loading tiles don't flash white/blue */
      .leaflet-container {
        background: #0a0a12 !important; 
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
      }

      /* 2. REMOVED aggressive flattening to fix marker drift on pan */
      /* The previous 'transform-style: flat' caused markers to detach visually during drag */

      /* 3. Fix Tile Tearing/Flickering/White Lines on Zoom */
      .leaflet-tile {
        /* GPU Acceleration + Anti-flicker hacks */
        transform: translate3d(0,0,0);
        will-change: transform;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        
        /* Outline prevents sub-pixel gaps (white lines) */
        outline: 1px solid transparent;
        border: none !important;
        
        /* Optimizes scaling quality */
        image-rendering: -webkit-optimize-contrast;
      }
      
      /* Prevent black flash on tile load */
      .leaflet-tile-container {
        transform: translate3d(0,0,0);
        -webkit-transform: translate3d(0,0,0);
      }

      /* 4. GPU Acceleration for Animations */
      .leaflet-fade-anim .leaflet-tile,
      .leaflet-zoom-anim .leaflet-zoom-animated {
        will-change: transform;
        transition: transform 0.25s cubic-bezier(0,0,0.25,1);
      }

      /* 5. Hide all default controls/attribution that might cause layout shifts */
      .leaflet-control-container .leaflet-top,
      .leaflet-control-container .leaflet-bottom {
        display: none !important;
      }
      .leaflet-control-attribution {
        display: none !important;
      }

      /* Glassmorphism Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.2);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 255, 255, 0.4);
      }

      /* Minimal Clean Map Styles - FIX BOXES */
      .leaflet-div-icon {
        background: transparent !important;
        border: none !important;
      }

      /* --- KAIKU CLUSTER MARKERS (FIXED SIZES) --- */
      
      /* FORCE small size for clusters */
      .custom-cluster-small {
        width: 30px !important;
        height: 30px !important;
        font-size: 12px !important;
        font-weight: bold !important;
        font-family: monospace !important;
        background-color: rgba(8, 51, 68, 0.9) !important; /* Dark Cyan */
        border: 2px solid #06b6d4 !important; /* Cyan-500 */
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        color: white !important;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.5) !important; /* Small glow */
        margin-left: -15px !important; /* Center fix */
        margin-top: -15px !important; /* Center fix */
        backdrop-filter: blur(4px);
      }
      
      .custom-cluster-medium { 
        width: 40px !important; 
        height: 40px !important; 
        font-size: 14px !important; 
        font-weight: bold !important;
        font-family: monospace !important;
        background-color: rgba(8, 51, 68, 0.95) !important; 
        border: 2px solid #22d3ee !important; 
        border-radius: 50% !important; 
        display: flex !important; 
        align-items: center !important; 
        justify-content: center !important; 
        color: white !important; 
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.6) !important; 
        margin-left: -20px !important; 
        margin-top: -20px !important; 
        backdrop-filter: blur(4px);
      }

      /* System Cluster Override */
      .system-cluster-override {
        background-color: rgba(69, 10, 10, 0.9) !important; /* Red-950 */
        border-color: #ef4444 !important; /* Red-500 */
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.5) !important;
      }

      /* =================================================================
         TIER 1: MACRO VIEW (Far Zoom < 10) - Micro-dots
         Targeting .map-macro-view wrapper
         ================================================================= */
      .map-macro-view .custom-cluster-small,
      .map-macro-view .custom-cluster-medium {
          width: 6px !important;   /* TINY size */
          height: 6px !important;
          margin-left: -3px !important; /* Perfect center */
          margin-top: -3px !important;
          background-color: #06b6d4 !important; /* Solid Cyan dot */
          border: none !important; /* No border at this scale */
          box-shadow: 0 0 4px #06b6d4 !important; /* Tiny glow */
          border-radius: 50%;
          /* Hide text */
          color: transparent !important;
          font-size: 0px !important;
          display: flex !important;
      }

      /* Pulse for macro dots */
      .map-macro-view .custom-cluster-small {
          animation: macro-pulse 3s infinite;
      }

      @keyframes macro-pulse {
          0% { box-shadow: 0 0 0 0px rgba(6, 182, 212, 0.4); }
          50% { box-shadow: 0 0 4px 2px rgba(6, 182, 212, 0); }
          100% { box-shadow: 0 0 0 0px rgba(6, 182, 212, 0); }
      }

      /* =================================================================
         TIER 3: STREET VIEW (Near Zoom >= 15) - Heat Fog ONLY
         Targeting .map-street-view wrapper
         ================================================================= */
      /* CRITICAL: Hide individual marker icons, leaving only the HeatmapLayer visible */
      .map-street-view .leaflet-marker-icon,
      .map-street-view .leaflet-marker-shadow {
          display: none !important;
      }

      /* --- INVISIBLE TRIGGER FOR ZOOMED IN NODES --- */
      .kaiku-invisible-trigger {
        width: 100%;
        height: 100%;
        background: transparent;
        border-radius: 50%;
        cursor: pointer;
        /* Debug Mode: Uncomment to see click areas */
        /* border: 1px solid red; */
      }

      /* --- KAIKU ARCS (Transient) --- */
      .kaiku-arc-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: shoot-arc 2.5s ease-out forwards;
        will-change: stroke-dashoffset, opacity;
      }

      @keyframes shoot-arc {
        0% { stroke-dashoffset: 1000; opacity: 0.8; }
        60% { stroke-dashoffset: 0; opacity: 0.8; }
        80% { stroke-dashoffset: 0; opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      /* --- CUSTOM POPUP STYLES --- */
      .kaiku-custom-popup .leaflet-popup-content-wrapper {
        background: rgba(10, 10, 18, 0.95);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        padding: 0;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      }
      .kaiku-custom-popup .leaflet-popup-tip {
        background: rgba(10, 10, 18, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1); /* Tip border match */
      }
      .kaiku-custom-popup .leaflet-popup-content {
        margin: 0;
        min-width: 220px !important;
      }
      .kaiku-custom-popup .leaflet-popup-close-button {
        display: none;
      }

    </style>

{

}
</script>
</head>
  <body class="bg-[#0a0a12] text-white">
    <div id="root"></div>

  </body>
</html>
