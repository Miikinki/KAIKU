<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KAIKU</title>
    <!-- KAIKU Signal Logo Favicon -->
    <link rel="icon" type="image/svg+xml" href="/kaiku-icon.svg" />
    <link rel="apple-touch-icon" href="/kaiku-icon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      /* FULL SCREEN RESET */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0a0a12;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .leaflet-container {
        height: 100%;
        width: 100%;
        background: #0a0a12;
        /* Hardware Acceleration */
        transform: translate3d(0,0,0);
        will-change: transform;
      }
      
      /* Glassmorphism Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.2);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 255, 255, 0.4);
      }

      /* Minimal Clean Map Styles */
      .leaflet-div-icon {
        background: transparent;
        border: none;
      }

      .leaflet-control-attribution {
        display: none !important;
      }

      /* --- KAIKU HEXAGONS --- */
      .kaiku-hex-polygon {
        transition: all 0.5s ease-out;
        transform-origin: center;
        /* "Plus Lighter" creates that intense neon overlap effect */
        mix-blend-mode: screen; 
        stroke-linejoin: round;
      }
      
      /* The Breathing Effect */
      .kaiku-hex-polygon:hover {
        fill-opacity: 0.9 !important;
        stroke: white !important;
        stroke-width: 1.5px !important; /* Reduced for high-res grid */
        filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.8));
        z-index: 1000;
      }

      /* --- KAIKU ARCS (Transient) --- */
      .kaiku-arc-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: shoot-arc 2.5s ease-out forwards;
        will-change: stroke-dashoffset, opacity;
      }

      @keyframes shoot-arc {
        0% { stroke-dashoffset: 1000; opacity: 0.8; }
        60% { stroke-dashoffset: 0; opacity: 0.8; }
        80% { stroke-dashoffset: 0; opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

    </style>
  <script type="importmap">
{

    "howler": "https://esm.sh/howler@^2.2.4",

</head>
